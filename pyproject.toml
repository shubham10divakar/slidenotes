[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "slidenotes"
version = "0.1.0"
description = "Link every slide of a PDF or PowerPoint to the notes that explain it: many-to-many, no screenshots."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Subham Divakar", email = "shubham.divakar@gmail.com" }]
keywords = ["notes", "slides", "pdf", "powerpoint", "study", "markdown", "docx", "cli", "obsidian"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Education",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Education",
    "Topic :: Office/Business",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Topic :: Utilities",
]
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "pypdf>=4",
    "lxml>=4.9",
    "pyyaml>=6",
]

[project.optional-dependencies]
ppt = ["python-pptx>=0.6.21"]
dev = ["pytest>=8", "python-pptx>=0.6.21", "build", "twine"]

[project.urls]
Homepage = "https://github.com/shubham10divakar/slidenotes"
Documentation = "https://github.com/shubham10divakar/slidenotes/blob/main/GUIDE.md"
Repository = "https://github.com/shubham10divakar/slidenotes"
Issues = "https://github.com/shubham10divakar/slidenotes/issues"
Changelog = "https://github.com/shubham10divakar/slidenotes/blob/main/CHANGELOG.md"

[project.scripts]
sn = "slidenotes.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/slidenotes"]
core-metadata-version = "2.4"

[tool.hatch.build.targets.sdist]
core-metadata-version = "2.4"
include = ["src/slidenotes", "tests", "README.md", "GUIDE.md", "CHANGELOG.md", "LICENSE", "v1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["libreoffice: needs LibreOffice (soffice) on PATH", "pandoc: needs pandoc on PATH"]
